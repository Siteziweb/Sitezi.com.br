<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="index,follow">
  <title>Carregando site...</title>
  <style>
    :root{--accent:#1578ff;--bg:#f7f9fc;--text:#111827;--muted:#667085;--card:#fff;--line:#e7eaf0}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit}.loading,.not-found{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:#07101d;color:#fff}
    .loading-card,.not-found-card{max-width:560px;padding:28px;border:1px solid #1e3553;border-radius:22px;background:#0a1627}
    .site{min-height:100vh}.wrap{width:min(1160px,calc(100% - 34px));margin:auto}
    .nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav-inner{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:14px;font-weight:950;text-decoration:none;font-size:19px}.brand img{width:auto;height:68px;max-width:190px;object-fit:contain;border-radius:0;flex:0 0 auto}
    .nav-links{display:flex;gap:18px;align-items:center}.nav-links a{text-decoration:none;color:var(--muted);font-weight:750;font-size:14px}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:0;border-radius:13px;padding:13px 18px;font-weight:900;background:var(--accent);color:#fff}
    .hero{padding:80px 0 60px}.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:50px;align-items:center}
    .eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.6px}
    h1{font-size:clamp(40px,6vw,76px);line-height:.96;letter-spacing:-3px;margin:17px 0 18px;max-width:900px}h2{font-size:clamp(30px,4vw,48px);letter-spacing:-1.6px;margin:0 0 12px}
    .hero p,.section-copy{font-size:18px;line-height:1.65;color:var(--muted);max-width:680px}
    .hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    .hero-media{min-height:430px;border-radius:28px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,#111827),#101827);display:grid;place-items:center;position:relative}
    .hero-media img{width:100%;height:100%;min-height:430px;object-fit:cover}.hero-mark{font-size:94px;font-weight:1000;color:#fff;opacity:.94}
    .trust{padding:18px 0;border-block:1px solid var(--line);background:var(--card)}.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.trust-item{text-align:center;padding:10px;font-size:13px;color:var(--muted);font-weight:800}
    section.content{padding:76px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
    .card-photo{aspect-ratio:16/10;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,#eef2f7),#eef2f7);display:grid;place-items:center}
    .card-photo img{width:100%;height:100%;object-fit:cover}.fallback-icon{font-size:42px}
    .card-body{padding:20px}.card h3{margin:0;font-size:21px;line-height:1.2}.price{display:block;color:var(--accent);font-size:19px;font-weight:950;margin-top:8px}.card p{color:var(--muted);line-height:1.55;margin:10px 0 16px}
    .about{background:var(--card);border-block:1px solid var(--line)}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}.about-box{border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--bg)}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px}
    .contact{padding:76px 0}.contact-card{border-radius:28px;padding:34px;background:#101827;color:#fff;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}.contact-card p{color:#c8d2e0;line-height:1.6}.contact-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    footer{padding:28px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    body.tpl-premium{--bg:#f4efe8;--text:#241f1b;--muted:#74685e;--card:#fffaf3;--line:#ded2c5}.tpl-premium h1,.tpl-premium h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-2px}.tpl-premium .hero-media{border-radius:999px 999px 28px 28px}.tpl-premium .cta{border-radius:3px}
    body.tpl-dynamic{--bg:#0c0c10;--text:#fff;--muted:#b9bbc4;--card:#15151b;--line:#292930}.tpl-dynamic .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,#f25a1b) 0 48%,#0c0c10 48%)}.tpl-dynamic .eyebrow{background:#fff;color:#111}.tpl-dynamic .hero p{color:#f2f2f2}.tpl-dynamic .hero-media{border:2px solid rgba(255,255,255,.15)}.tpl-dynamic .card{border-radius:14px}
    @media(max-width:850px){.nav-links{display:none}.hero{padding-top:48px}.hero-grid,.about-grid,.contact-card{grid-template-columns:1fr}.hero-media{min-height:300px}.hero-media img{min-height:300px}.cards{grid-template-columns:1fr 1fr}.trust-grid{grid-template-columns:1fr 1fr}.contact-actions{justify-content:flex-start}}
    @media(max-width:560px){.wrap{width:min(100% - 24px,1160px)}.nav-inner{min-height:64px}.hero{padding:38px 0 44px}h1{letter-spacing:-2px}.cards,.gallery{grid-template-columns:1fr}.section-head{display:block}.trust-grid{grid-template-columns:1fr 1fr}.contact-card{padding:24px}.hero-media{min-height:250px}.hero-media img{min-height:250px}}
  
    @media(max-width:700px){
      .nav-inner{min-height:80px}
      .brand img{height:56px;max-width:150px}
    }

  </style>
</head>
<body>
  <div id="loading" class="loading"><div class="loading-card"><strong>Carregando site...</strong><p>Estamos preparando esta página.</p></div></div>
  <div id="app"></div>

  <script type="module">
    const SUPABASE_URL="https://tmhosrhnwjertbsempeu.supabase.co";
    const SUPABASE_KEY="sb_publishable_Gx-4spNVicrUfn3Pd8GxCg_7ii-70Lw";
    const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    const client=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const safeUrl=v=>/^https?:\/\//i.test(String(v||""))?String(v):"";
    const pathParts=location.pathname.split("/").filter(Boolean);
    const slug=(new URLSearchParams(location.search).get("slug")||pathParts[pathParts.indexOf("site")+1]||"").toLowerCase().trim();

    if(location.search.includes("slug=")&&slug){
      history.replaceState(null,"",`/site/${encodeURIComponent(slug)}`);
    }

    function notFound(){
      document.title="Site não encontrado — SITEZI";
      document.getElementById("loading").remove();
      document.getElementById("app").innerHTML=`<div class="not-found"><div class="not-found-card"><h1 style="font-size:36px;letter-spacing:-1px">Site não encontrado</h1><p>Este endereço não existe ou o site ainda não foi publicado.</p><a class="cta" href="/">Ir para a SITEZI</a></div></div>`;
    }

    if(!slug){notFound();}
    else{
      const {data,error}=await client.rpc("get_published_site",{p_slug:slug});
      const site=data||null;
      if(error||!site){console.error(error);notFound();}
      else render(site);
    }

    function render(site){
      const cfg=site.configuration||{};
      const products=Array.isArray(cfg.products)?cfg.products:[];
      const photos=Array.isArray(cfg.photos)?cfg.photos.filter(safeUrl):[];
      const logo=safeUrl(cfg.logo_data);
      const hero=photos[0]||"";
      const accent=/^#[0-9a-f]{6}$/i.test(cfg.color||"")?cfg.color:"#1578ff";
      document.documentElement.style.setProperty("--accent",accent);
      document.body.className=`tpl-${site.template||"modern"}`;
      document.title=`${site.business_name||"Meu negócio"} — Site oficial`;
      const wa=String(cfg.whatsapp||"").replace(/\D/g,"");
      const waUrl=wa?`https://wa.me/${wa}`:"";
      const insta=String(cfg.instagram||"").replace(/^@/,"").trim();
      const instaUrl=insta?`https://instagram.com/${encodeURIComponent(insta)}`:"";
      const mail=String(cfg.email||"").trim();
      const heroMedia=hero?`<img src="${esc(hero)}" alt="${esc(site.business_name||"")}">`:`<div class="hero-mark">${esc((site.business_name||"S").charAt(0).toUpperCase())}</div>`;
      const cards=products.length?products.map((p,i)=>`
        <article class="card">
          <div class="card-photo">${safeUrl(p.photo)?`<img src="${esc(p.photo)}" alt="${esc(p.name||"")}">`:`<span class="fallback-icon">${["✦","◆","●","▲"][i%4]}</span>`}</div>
          <div class="card-body">
            <h3>${esc(p.name||"Produto ou serviço")}</h3>
            ${p.price?`<span class="price">${esc(p.price)}</span>`:""}
            ${p.description?`<p>${esc(p.description)}</p>`:""}
            ${waUrl?`<a class="cta" href="${waUrl}" target="_blank" rel="noopener">Tenho interesse →</a>`:""}
          </div>
        </article>`).join(""):`<article class="card"><div class="card-body"><h3>Em breve</h3><p>Novidades deste negócio serão adicionadas aqui.</p></div></article>`;
      const gallery=photos.slice(1,7).map((p,i)=>`<img src="${esc(p)}" alt="${esc(site.business_name||"")} ${i+1}">`).join("");

      document.getElementById("loading").remove();
      document.getElementById("app").innerHTML=`
        <div class="site">
          <header class="nav"><div class="wrap nav-inner">
            <a class="brand" href="#inicio">${logo?`<img src="${esc(logo)}" alt="Logo">`:""}<span>${esc(site.business_name||"Meu negócio")}</span></a>
            <nav class="nav-links"><a href="#servicos">Produtos e serviços</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a></nav>
            ${waUrl?`<a class="cta" href="${waUrl}" target="_blank" rel="noopener">WhatsApp</a>`:""}
          </div></header>

          <main id="inicio">
            <section class="hero"><div class="wrap hero-grid">
              <div>
                <span class="eyebrow">${esc(site.business_type||"Negócio local")}</span>
                <h1>${esc(site.business_name||"Meu negócio")}</h1>
                <p>${esc(cfg.slogan||"Qualidade, confiança e atendimento para você.")}</p>
                <div class="hero-actions">
                  <a class="cta" href="#servicos">Conheça nossos serviços</a>
                  ${waUrl?`<a class="cta ghost" href="${waUrl}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:""}
                </div>
              </div>
              <div class="hero-media">${heroMedia}</div>
            </div></section>

            <div class="trust"><div class="wrap trust-grid">
              <div class="trust-item">✓ Atendimento profissional</div><div class="trust-item">✓ Contato fácil</div><div class="trust-item">✓ Informações atualizadas</div><div class="trust-item">✓ Feito para você</div>
            </div></div>

            <section id="servicos" class="content"><div class="wrap">
              <div class="section-head"><div><h2>Destaques do nosso negócio</h2><p class="section-copy">Conheça os principais produtos e serviços disponíveis.</p></div></div>
              <div class="cards">${cards}</div>
            </div></section>

            <section id="sobre" class="content about"><div class="wrap about-grid">
              <div><span class="eyebrow">Sobre nós</span><h2>${esc(site.business_name||"Nosso negócio")}</h2><p class="section-copy">${esc(cfg.slogan||"Estamos prontos para atender você com qualidade e atenção.")}</p></div>
              <div class="about-box">
                ${cfg.location?`<p><strong>Atendimento:</strong><br>${esc(cfg.location)}</p>`:""}
                ${mail?`<p><strong>E-mail:</strong><br><a href="mailto:${esc(mail)}">${esc(mail)}</a></p>`:""}
                ${insta?`<p><strong>Instagram:</strong><br><a href="${instaUrl}" target="_blank" rel="noopener">@${esc(insta)}</a></p>`:""}
              </div>
            </div></section>

            ${gallery?`<section class="content"><div class="wrap"><div class="section-head"><div><h2>Nosso trabalho</h2><p class="section-copy">Alguns registros do nosso negócio.</p></div></div><div class="gallery">${gallery}</div></div></section>`:""}

            <section id="contato" class="contact"><div class="wrap"><div class="contact-card">
              <div><h2 style="margin:0;color:#fff">Vamos conversar?</h2><p>Entre em contato e saiba mais sobre nossos produtos e serviços.</p></div>
              <div class="contact-actions">
                ${waUrl?`<a class="cta" href="${waUrl}" target="_blank" rel="noopener">WhatsApp</a>`:""}
                ${mail?`<a class="cta ghost" style="color:#fff;border-color:#405068" href="mailto:${esc(mail)}">E-mail</a>`:""}
              </div>
            </div></div></section>
          </main>
          <footer><div class="wrap foot"><span>© ${new Date().getFullYear()} ${esc(site.business_name||"Meu negócio")}</span><span>Site criado com SITEZI</span></div></footer>
        </div>`;
    }
  </script>
</body>
</html>
