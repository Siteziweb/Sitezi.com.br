const SUPABASE_KEY="sb_publishable_Gx-4spNVicrUfn3Pd8GxCg_7ii-70Lw";

async function getPublishedSite(slug){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_published_site`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":`Bearer ${SUPABASE_KEY}`
      },
      body:JSON.stringify({p_slug:slug}),
      signal:controller.signal
    });
    if(!response.ok){
      const body=await response.text().catch(()=>"");
      throw new Error(`Erro ${response.status}${body?`: ${body.slice(0,180)}`:""}`);
    }
    return await response.json();
  }finally{
    clearTimeout(timer);
  }
}

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const safeUrl=v=>/^https?:\/\//i.test(String(v||""))?String(v):"";

const slug=(new URLSearchParams(location.search).get("slug")||parts[parts.indexOf("site")+1]||"").toLowerCase().trim();

if(location.search.includes("slug=")&&slug){

}

const FONTS={
  "luxury-serif":['"Cormorant Garamond",Georgia,serif','https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap'],
  "editorial-serif":['"Playfair Display",Georgia,serif','https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap'],
  "classic-serif":['"Libre Baskerville",Georgia,serif','https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap'],
  "modern-sans":['Montserrat,Inter,Arial,sans-serif','https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap'],
  "clean-geometric":['Manrope,Inter,Arial,sans-serif','https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap'],

function decodeIdentity(mode){
  const raw=String(mode||"");
  if(!raw.startsWith("name-ai:"))return null;
  try{
    const bin=atob(raw.slice(8));
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(_){
    return null;
  }
}

function safeIdentity(raw,name){
  if(!raw||typeof raw!=="object")return null;
  const fontKey=FONTS[raw.fontKey]?raw.fontKey:"modern-sans";
  const layout=["stacked","inline","split"].includes(raw.layout)?raw.layout:"stacked";
  const textCase=["original","upper","title","lower"].includes(raw.case)?raw.case:"original";
  const align=["left","center"].includes(raw.align)?raw.align:"left";
  const words=String(name||"").trim().split(/\s+/).filter(Boolean);
  let primary=String(raw.primaryText||"").trim();
  let secondary=String(raw.secondaryText||"").trim();

  if(!primary){
    primary=words.slice(0,Math.max(1,Math.ceil(words.length/2))).join(" ");
    secondary=words.slice(Math.ceil(words.length/2)).join(" ");
  }

  return{
    primaryText:primary,
    secondaryText:secondary,
    fontKey,
    layout,
    case:textCase,
    align,
    weight:Math.min(950,Math.max(500,Number(raw.weight)||800)),
    letterSpacing:Math.min(.18,Math.max(-.04,Number(raw.letterSpacing)||0)),
    primaryScale:Math.min(1.7,Math.max(.9,Number(raw.primaryScale)||1.2)),
    secondaryScale:Math.min(1,Math.max(.4,Number(raw.secondaryScale)||.62)),
    accentWord:String(raw.accentWord||"").trim(),
    showInHero:raw.showInHero!==false
  };
}

function tx(v,m){
  v=String(v||"");
  if(m==="upper")return v.toLocaleUpperCase("pt-BR");
  if(m==="lower")return v.toLocaleLowerCase("pt-BR");
  if(m==="title")return v.toLocaleLowerCase("pt-BR").replace(/(^|\s|[-'’])\p{L}/gu,x=>x.toLocaleUpperCase("pt-BR"));
  return v;
}

function wordsHtml(text,accent,mode){
  const a=tx(accent,mode).toLocaleLowerCase("pt-BR");
  return tx(text,mode).split(/(\s+)/).map(x=>x.trim()&&a&&x.toLocaleLowerCase("pt-BR")===a?`<span class="name-accent">${esc(x)}</span>`:esc(x)).join("");
}

function wordmark(spec,hero=false){
  if(!spec)return"";
  return `<${hero?"div":"span"} class="${hero?"name-hero":"name-brand"} ${spec.layout}"><span class="name-primary">${wordsHtml(spec.primaryText,spec.accentWord,spec.case)}</span>${spec.secondaryText?`<span class="name-secondary">${wordsHtml(spec.secondaryText,spec.accentWord,spec.case)}</span>`:""}</${hero?"div":"span"}>`;
}

function category(site,cfg){
  const products=Array.isArray(cfg.products)?cfg.products:[];
  const all=[site.business_type,site.business_name,...products.flatMap(p=>[p.name,p.description])].join(" ").toLowerCase();

  if(/elétr|eletr|fiação|fiacao|disjunt/.test(all))return"electrical";
  if(/hidrául|hidraul|encan|vazamento/.test(all))return"plumbing";
  if(/oficina|mecân|mecan|automot|moto|carro/.test(all))return"auto";
  if(/restaurante|pizza|hamb|cafeteria|comida/.test(all))return"restaurant";
  if(/barbear|barber/.test(all))return"barber";
  if(/salão|salao|beleza|estética|estetica/.test(all))return"beauty";
  if(/moda|roupa|vestuário|vestuario|calçado|calcado/.test(all))return"fashion";
  if(/clínica|clinica|saúde|saude|dent|fisi|psic/.test(all))return"health";
  if(/loja|varejo|comércio|comercio/.test(all))return"retail";
  return"service";
}

      </div>
    </article>`).join("");

  const galleryPhotos=photos.slice(1);

    :"";

  document.getElementById("loading")?.remove();
  document.getElementById("app").innerHTML=`

          <small>SERVIÇOS / PRODUTOS</small>

          <p>Conheça os principais serviços ou produtos cadastrados.</p>
        </div>
        <div class="services">${cards}</div>
      </div>
    </section>

    ${gallery}

    <section id="sobre" class="section">
      <div class="wrap about-grid">
        <div class="section-head">
          <small>SOBRE</small>
          <h2>${esc(name)}</h2>
          <p>${esc(slogan||p.intro)}</p>
        </div>
        <div class="about-card">
          <h3>Atendimento próximo e direto</h3>
          <p>Use os canais abaixo para confirmar detalhes, horários, disponibilidade e valores diretamente com a empresa.</p>
        </div>
      </div>
    </section>

    <section id="contato" class="section">
      <div class="wrap contact-grid">
        <div class="section-head">
          <small>CONTATO</small>
          <h2>Vamos conversar?</h2>
          <p>Escolha o canal que for melhor para você.</p>
        </div>
        <div class="contact-card">
          <h3>${esc(name)}</h3>
          <div class="contact-list">
            ${wa?`<a href="${waHref}" target="_blank" rel="noopener">WhatsApp</a>`:""}
            ${instagram?`<a href="https://instagram.com/${encodeURIComponent(instagram)}" target="_blank" rel="noopener">Instagram @${esc(instagram)}</a>`:""}
            ${mail?`<a href="mailto:${esc(mail)}">${esc(mail)}</a>`:""}
            <span>${esc(locationText)}</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footerin">
      <span>© ${new Date().getFullYear()} ${esc(name)}</span>
      <span class="sitezi-badge">Criado com SITEZI</span>
    </div>
  </footer>

  ${wa?`<a class="wa-float" href="${waHref}" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><span class="wa-float-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.3A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M8.7 8.2c.4 2.8 2.3 4.8 5.1 5.6l1.2-1.2c.2-.2.5-.3.8-.2l2 .7"/><path d="M8.7 8.2 9.4 6c.1-.3 0-.6-.2-.8L7.9 4"/></svg></span><span>WhatsApp</span></a>`:""}`;

  window.SITEZI_PUBLIC_SITE = site;
}

window.SITEZI_PUBLIC_RENDER = render;

async function loadPublishedSite(){
  if(!slug){
    fail();
    return;
  }

  try{
    const data=await getPublishedSite(slug);

    if(!data){
      fail();
      return;
    }

    render(data);
  }catch(error){
    console.error("[SITEZI PUBLIC]",error);
    document.getElementById("loading")?.remove();
    document.getElementById("app").innerHTML=`
      <div class="not-found">
        <div class="box">
          <h1>Não foi possível carregar o site</h1>
          <p>Tente novamente em alguns instantes.</p>
          <button class="cta" onclick="location.reload()">Tentar novamente</button>
        </div>
      </div>`;
  }
}

queueMicrotask(loadPublishedSite);
</script>
